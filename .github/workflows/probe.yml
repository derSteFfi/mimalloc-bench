name: CI probe (ubuntu, ff)

# Throwaway workflow for the ff/gs "cannot be preloaded" failures observed in
# "Build and run everything". Resolved: Ubuntu 26.04 (what ubuntu-latest is
# now) ships /etc/apparmor.d/gs from the apparmor package, an AppArmor profile
# named "gs" attached to /usr/bin/gs. It allows reads only of the system
# library and share dirs, owner-owned documents with known extensions under
# $HOME, /mnt or /media, and owner files under /tmp - so the allocator library and
# extern/large.pdf are both denied to gs, ld.so reports the generic "cannot be
# preloaded (cannot open shared object file)", gs dies, and bench.sh still
# records a row with the system allocator. The Docker build sandbox is
# unconfined (privileged buildx worker), which is why the host profile applies
# to processes inside it.
#
# This workflow now (1) prints the profile and its owning package, (2) unloads
# it, and (3) runs the reduced bench with the in-container probes from
# ci-gs-probe.sh. probe_run keeps the probe and benchmark steps out of the
# build cache. With the profile unloaded, the gs row must show the real-ff
# fingerprint (about 2 s, 1.0 M page faults) instead of 0.04 s / 3 k faults.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Identify the host profile attached to gs
        run: |
          echo "== loaded profiles =="
          sudo cat /sys/kernel/security/apparmor/profiles | sort | head -40
          echo "== profile files declaring a gs profile =="
          sudo grep -rlE '^[[:space:]]*profile[[:space:]]+gs([[:space:]({]|$)' \
            /etc/apparmor.d /var/lib/snapd/apparmor 2>/dev/null |
            grep -av '/abstractions/\|/tunables/' | tee /tmp/gs-profiles || true
          for f in $(sort -u /tmp/gs-profiles); do
            echo "== $f (owner: $(dpkg -S "$f" 2>&1 | head -1))"
            sudo cat "$f"
          done
          echo "== docker sandbox context =="
          docker info --format 'SecurityOptions: {{.SecurityOptions}}'
          docker ps --format '{{.Names}}' |
            xargs -r -I{} docker inspect --format '{}: privileged={{.HostConfig.Privileged}} security={{.HostConfig.SecurityOpt}}' || true

      - name: Unload the gs profile on the host
        run: |
          for f in $(sort -u /tmp/gs-profiles); do
            sudo ln -sf "$f" /etc/apparmor.d/disable/ 2>/dev/null
            sudo apparmor_parser -R "$f" || true
          done
          echo "== profiles after unload (gs should be gone) =="
          sudo cat /sys/kernel/security/apparmor/profiles | sort |
            grep -iE '(^|[^a-z])gs[[:space:]]' || echo "  no gs profile loaded"

      - name: Build allocator and run probes + benchmarks in Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.probe
          push: false
          target: benchmark
          build-args: |
            platform=ubuntu
            allocator=ff
            benchs=cfrac barnes gs
            repeats=1
            probe_run=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=buildkit_ubuntu
          cache-to: type=gha,mode=max,scope=buildkit_ubuntu
